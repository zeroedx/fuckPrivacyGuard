name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*-*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Structure check
        run: sh scripts/check_structure.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 纯 JVM，不需要设备或 SDK：覆盖 noteHit 首次命中去重与日志格式
      - name: Offline hook tests
        run: sh tests/run.sh

      # 需要 build-tools 35+：34 的 d8（R8 8.2）解析 libxposed 里的 Java 17 class 会 NPE
      - name: Prepare Android build-tools
        run: |
          set -e
          curl -sSL --max-time 300 -o /tmp/bt.zip \
            https://dl.google.com/android/repository/build-tools_r35_linux.zip
          unzip -tq /tmp/bt.zip > /dev/null
          rm -rf /tmp/bt && mkdir -p /tmp/bt
          unzip -q /tmp/bt.zip -d /tmp/bt
          D8BIN=$(find /tmp/bt -type f -name d8 | head -1)
          BT=$(dirname "$D8BIN")
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          echo "D8=$BT/d8" >> "$GITHUB_ENV"
          echo "AAPT2=$BT/aapt2" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$BT/zipalign" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"
          echo "build-tools dir: $BT"
          ls "$BT" | head -20

      - name: Prepare android.jar
        run: |
          set -e
          AJ=""
          for u in \
            "https://dl.google.com/android/repository/platform-35_r02.zip" \
            "https://dl.google.com/android/repository/platform-35-ext15_r01.zip" \
            "https://dl.google.com/android/repository/platform-34_r03.zip"; do
            echo "try $u"
            if curl -sSL --max-time 240 -o /tmp/p.zip "$u" && unzip -tq /tmp/p.zip >/dev/null 2>&1; then
              rm -rf /tmp/sdk && mkdir -p /tmp/sdk
              unzip -q /tmp/p.zip -d /tmp/sdk
              AJ=$(find /tmp/sdk -name android.jar | head -1)
              [ -n "$AJ" ] && break
            fi
          done
          if [ -z "$AJ" ]; then
            echo "platform 下载失败，回退到 Maven stub"
            curl -sSL --max-time 180 -o /tmp/android-stub.jar \
              "https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar"
            AJ=/tmp/android-stub.jar
          fi
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          echo "android.jar: $AJ"

      # 用刚准备好的 android.jar 校验 applist 四组重载签名在平台里真实存在
      - name: Hook signature check
        run: sh scripts/check_hooks.sh

      - name: Build
        run: sh build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperPGuard-apk
          path: HyperPGuard.apk
          if-no-files-found: error

      # 推 tag（v1.0.1 这种）时自动建 Release：正文取 docs/RELEASE-<tag>.md，附件是构建出的 APK
      - name: Pick release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          T="${GITHUB_REF_NAME#v}"
          # 兼容 LSPosed 仓库要求的 <versionCode>-<versionName> 形式，例如 4-1.1.1
          V="$T"
          case "$T" in
            [0-9]*-*) V="${T#*-}" ;;
          esac
          F=""
          for c in "docs/RELEASE-${V}.md" "docs/RELEASE-${T}.md" "docs/RELEASE.md"; do
            if [ -f "$c" ]; then F="$c"; break; fi
          done
          if [ -z "$F" ]; then
            echo "找不到 docs/RELEASE-${V}.md 或 docs/RELEASE.md" >&2
            exit 1
          fi
          echo "RELEASE_BODY=$F" >> "$GITHUB_ENV"
          echo "RELEASE_VER=$V" >> "$GITHUB_ENV"
          echo "release notes: $F (version $V)"

      # 同步到 LSPosed 分发仓库（tag 必须是 versionCode-versionName）
      - name: Publish to LSPosed repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 LSPOSED_TOKEN，跳过"
            exit 0
          fi
          DIST=io.github.vivibibi30.hyperpguard
          gh api "repos/Xposed-Modules-Repo/$DIST" >/dev/null 2>&1 \
            || { echo "分发仓未就绪，跳过"; exit 0; }
          CODE=$("$AAPT2" dump badging HyperPGuard.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$("$AAPT2" dump badging HyperPGuard.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          TAG="$CODE-$NAME"
          NOTES="docs/RELEASE-$NAME.md"
          [ -f "$NOTES" ] || NOTES="docs/RELEASE.md"
          cp HyperPGuard.apk "/tmp/HyperPGuard-$NAME.apk"
          REPO="Xposed-Modules-Repo/$DIST"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "HyperPGuard-$NAME.apk" --repo "$REPO" --yes 2>/dev/null || true
            gh release upload "$TAG" "/tmp/HyperPGuard-$NAME.apk" --repo "$REPO"
          else
            gh release create "$TAG" "/tmp/HyperPGuard-$NAME.apk" --repo "$REPO" \
              --title "$NAME" --notes-file "$NOTES"
          fi

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: HyperPGuard ${{ env.RELEASE_VER }}
          body_path: ${{ env.RELEASE_BODY }}
          files: HyperPGuard.apk
          fail_on_unmatched_files: true
