name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*-*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_only:
        description: '仅做正式签名验证（不发布、不打 Tag、不建 Release）'
        type: boolean
        default: false

permissions:
  contents: write

# 同一 ref 串行执行，防止同一 Tag 并发发布；
# 正式发布（tag）绝不取消正在运行的实例，非发布构建才取消被取代的旧实例。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Structure check
        run: sh scripts/check_structure.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 纯 JVM，不需要设备或 SDK：覆盖 noteHit 首次命中去重与日志格式
      - name: Offline hook tests
        run: sh tests/run.sh

      # 需要 build-tools 35+：34 的 d8（R8 8.2）解析 libxposed 里的 Java 17 class 会 NPE
      - name: Prepare Android build-tools
        run: |
          set -e
          curl -sSL --max-time 300 -o /tmp/bt.zip \
            https://dl.google.com/android/repository/build-tools_r35_linux.zip
          unzip -tq /tmp/bt.zip > /dev/null
          rm -rf /tmp/bt && mkdir -p /tmp/bt
          unzip -q /tmp/bt.zip -d /tmp/bt
          D8BIN=$(find /tmp/bt -type f -name d8 | head -1)
          BT=$(dirname "$D8BIN")
          test -x "$BT/aapt2"
          test -x "$BT/zipalign"
          echo "D8=$BT/d8" >> "$GITHUB_ENV"
          echo "AAPT2=$BT/aapt2" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$BT/zipalign" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BT/apksigner" >> "$GITHUB_ENV"
          echo "build-tools dir: $BT"
          ls "$BT" | head -20

      - name: Prepare android.jar
        run: |
          set -e
          AJ=""
          for u in \
            "https://dl.google.com/android/repository/platform-35_r02.zip" \
            "https://dl.google.com/android/repository/platform-35-ext15_r01.zip" \
            "https://dl.google.com/android/repository/platform-34_r03.zip"; do
            echo "try $u"
            if curl -sSL --max-time 240 -o /tmp/p.zip "$u" && unzip -tq /tmp/p.zip >/dev/null 2>&1; then
              rm -rf /tmp/sdk && mkdir -p /tmp/sdk
              unzip -q /tmp/p.zip -d /tmp/sdk
              AJ=$(find /tmp/sdk -name android.jar | head -1)
              [ -n "$AJ" ] && break
            fi
          done
          if [ -z "$AJ" ]; then
            echo "platform 下载失败，回退到 Maven stub"
            curl -sSL --max-time 180 -o /tmp/android-stub.jar \
              "https://repo1.maven.org/maven2/com/google/android/android/4.1.1.4/android-4.1.1.4.jar"
            AJ=/tmp/android-stub.jar
          fi
          echo "ANDROID_JAR=$AJ" >> "$GITHUB_ENV"
          echo "android.jar: $AJ"

      # 用刚准备好的 android.jar 校验 applist 四组重载签名在平台里真实存在
      - name: Hook signature check
        run: sh scripts/check_hooks.sh

      # 正式签名材料从仓库 Secrets 注入，绝不写进仓库或日志。
      # 需要在仓库 Secrets 中配置：SIGNING_KEYSTORE_B64（keystore 的 base64）、
      # SIGNING_KEY_ALIAS、SIGNING_STORE_PASS、SIGNING_KEY_PASS、SIGNING_CERT_SHA256。
      - name: Prepare signing material
        if: startsWith(github.ref, 'refs/tags/') || inputs.sign_only
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASS: ${{ secrets.SIGNING_STORE_PASS }}
          SIGNING_KEY_PASS: ${{ secrets.SIGNING_KEY_PASS }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -e
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_KEY_ALIAS" ] \
             || [ -z "$SIGNING_STORE_PASS" ] || [ -z "$SIGNING_CERT_SHA256" ]; then
            echo "缺少签名 Secrets，无法构建正式 Release" >&2
            exit 1
          fi
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > "$KS"
          chmod 600 "$KS"
          {
            echo "KEYSTORE=$KS"
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "STORE_PASS=$SIGNING_STORE_PASS"
            echo "KEY_PASS=${SIGNING_KEY_PASS:-$SIGNING_STORE_PASS}"
            echo "EXPECT_SHA256=$SIGNING_CERT_SHA256"
          } >> "$GITHUB_ENV"

      # 非 tag 构建（push/PR）只做冒烟：不签名也能验证编译与打包流程。
      # 用一次性本地密钥仅用于让 build.sh 跑完，产物不上传为发布件。
      - name: Ephemeral signing (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.sign_only }}
        run: |
          set -e
          KS="$RUNNER_TEMP/ephemeral.jks"
          keytool -genkeypair -keystore "$KS" -alias ci -keyalg RSA -keysize 2048 \
            -validity 30 -storetype PKCS12 -storepass ci-only -keypass ci-only \
            -dname "CN=CI Smoke, O=ci, C=CN" >/dev/null 2>&1
          SHA=$(keytool -list -v -keystore "$KS" -storepass ci-only -alias ci 2>/dev/null \
            | sed -n 's/.*SHA256: //p' | head -1 | tr -d '\r' | tr 'A-F' 'a-f' | tr -d ':')
          {
            echo "KEYSTORE=$KS"
            echo "KEY_ALIAS=ci"
            echo "STORE_PASS=ci-only"
            echo "KEY_PASS=ci-only"
            echo "EXPECT_SHA256=$SHA"
          } >> "$GITHUB_ENV"

      - name: Build
        run: sh build.sh

      # 记录构建产物指纹：同步到 LSPosed 前后都要比对，确保分发件与构建件逐字节一致
      - name: Compute APK SHA-256
        run: |
          set -e
          SHA=$(sha256sum fuckPrivacyGuard.apk | awk '{print $1}')
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "built APK sha256: $SHA"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fuckPrivacyGuard-apk
          path: fuckPrivacyGuard.apk
          if-no-files-found: error

      # workflow_dispatch 仅签名验证：用正式密钥签名并校验包名 / 版本 / 证书指纹，
      # 不发布、不打 Tag、不建 Release。正式发布仍只走 v* tag。
      - name: Sign-only verification (workflow_dispatch)
        if: inputs.sign_only
        run: |
          set -e
          echo "包名/版本："
          "$AAPT2" dump badging fuckPrivacyGuard.apk | head -1
          CERT=$("$APKSIGNER" verify --print-certs fuckPrivacyGuard.apk 2>/dev/null \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d '\r' | tr 'A-F' 'a-f' | tr -d ':')
          echo "证书 SHA-256：$CERT"
          if [ "$CERT" != "$EXPECT_SHA256" ]; then
            echo "::error::签名证书 SHA-256 与 EXPECT_SHA256 不一致：$CERT != $EXPECT_SHA256"
            exit 1
          fi
          {
            echo "## 仅签名验证（未发布）"
            echo ""
            echo "- 证书 SHA-256：\`$CERT\`"
            echo "- 期望值：\`$EXPECT_SHA256\` ✅"
            echo "- APK SHA-256：\`$APK_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "仅签名验证通过（未发布、未打 Tag、未建 Release）"

      # 发布元数据：从 tag 推版本号、选择发布说明、生成带版本的资产名
      # 发布统一走 `v*` tag（如 v2.1.1），一次完成「主仓 Release → 校验 → LSPosed 同步」
      - name: Prepare release metadata
        id: meta
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          T="${GITHUB_REF_NAME#v}"
          # 兼容 LSPosed 要求的 <versionCode>-<versionName> 形式，例如 72-2.1.1
          V="$T"
          case "$T" in
            [0-9]*-*) V="${T#*-}" ;;
          esac
          F=""
          for c in "docs/RELEASE-${V}.md" "docs/RELEASE-${T}.md" "docs/RELEASE.md"; do
            if [ -f "$c" ]; then F="$c"; break; fi
          done
          if [ -z "$F" ]; then
            echo "找不到 docs/RELEASE-${V}.md 或 docs/RELEASE.md" >&2
            exit 1
          fi
          ASSET="fuckPrivacyGuard-${V}.apk"
          cp fuckPrivacyGuard.apk "$ASSET"
          {
            echo "RELEASE_BODY=$F"
            echo "RELEASE_VER=$V"
            echo "RELEASE_ASSET=$ASSET"
            echo "MAIN_REPO=zeroedx/fuckPrivacyGuard"
          } >> "$GITHUB_ENV"
          echo "release notes: $F (version $V, asset $ASSET)"

      # 发布顺序第 1 步：主仓 Release（仅 v* tag）。幂等：
      #   已存在同 tag Release 且同名 APK 的 SHA-256 相同 → 安全跳过上传
      #   已存在但 SHA-256 不同 → 报错停止，绝不覆盖、绝不删除
      - name: Publish main repo Release (idempotent)
        id: main_release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          MAIN_TAG="$GITHUB_REF_NAME"
          echo "主仓 $MAIN_REPO tag=$MAIN_TAG asset=$RELEASE_ASSET 期望 sha256=$APK_SHA256"
          if gh release view "$MAIN_TAG" --repo "$MAIN_REPO" >/dev/null 2>&1; then
            echo "已存在主仓 Release $MAIN_TAG，检查附件"
            if gh release view "$MAIN_TAG" --repo "$MAIN_REPO" --json assets \
                 --jq '.assets[].name' | grep -qxF "$RELEASE_ASSET"; then
              rm -rf /tmp/main-existing && mkdir -p /tmp/main-existing
              gh release download "$MAIN_TAG" --repo "$MAIN_REPO" \
                --pattern "$RELEASE_ASSET" --dir /tmp/main-existing --clobber
              EXIST_SHA=$(sha256sum "/tmp/main-existing/$RELEASE_ASSET" | awk '{print $1}')
              if [ "$EXIST_SHA" = "$APK_SHA256" ]; then
                echo "主仓 Release 附件 SHA-256 相同，安全跳过上传"
              else
                echo "::error::主仓 Release 附件 SHA-256 与本次构建不同：$EXIST_SHA != $APK_SHA256；停止，不覆盖、不删除"
                exit 1
              fi
            else
              echo "Release $MAIN_TAG 已存在但缺少附件 $RELEASE_ASSET；仅补传该附件（不删除其它资产）"
              gh release upload "$MAIN_TAG" "$RELEASE_ASSET" --repo "$MAIN_REPO"
            fi
          else
            echo "创建主仓 Release $MAIN_TAG"
            gh release create "$MAIN_TAG" "$RELEASE_ASSET" --repo "$MAIN_REPO" \
              --title "fuckPrivacyGuard $RELEASE_VER" --notes-file "$RELEASE_BODY"
          fi
          echo "MAIN_RELEASE_OK=true" >> "$GITHUB_ENV"

      # 发布顺序第 2 步：下载主仓 Release 的 APK 并校验 SHA-256（必须与构建件逐字节一致）
      - name: Verify main repo Release APK
        id: verify_main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/main-verify && mkdir -p /tmp/main-verify
          gh release download "$GITHUB_REF_NAME" --repo "$MAIN_REPO" \
            --pattern "$RELEASE_ASSET" --dir /tmp/main-verify --clobber
          GOT=$(sha256sum "/tmp/main-verify/$RELEASE_ASSET" | awk '{print $1}')
          if [ "$GOT" != "$APK_SHA256" ]; then
            echo "::error::主仓 Release APK SHA-256 与构建件不一致：$GOT != $APK_SHA256"
            exit 1
          fi
          echo "MAIN_RELEASE_OK=true" >> "$GITHUB_ENV"
          echo "主仓 Release 校验通过：$RELEASE_ASSET sha256=$GOT"

      # 发布顺序第 3 步：同步到 LSPosed 分发仓。
      # 默认关闭：仅当仓库变量 ENABLE_LSPOSED_SYNC == 'true' 时才执行；
      # 未设置或不为 true 时整步跳过，不会调用分发仓 API，也不创建 Tag/Release/上传。
      # 执行时必须复用「主仓 Release 的原始 APK」，且 SHA-256 与构建件一致；不满足则跳过。
      # 授权判定不采信 permissions.push：安装令牌以「安装覆盖仓库列表」为准，
      # 细粒度 PAT 才回退到仓库 permissions.push。
      - name: Sync to LSPosed dist repo
        id: sync_lsposed
        if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_LSPOSED_SYNC == 'true'
        env:
          GH_TOKEN: ${{ secrets.LSPOSED_TOKEN }}
        run: |
          set -e
          if [ "${MAIN_RELEASE_OK:-}" != "true" ]; then
            echo "::warning::主仓 Release 未发布或未通过校验，跳过 LSPosed 同步（发布请使用 v* tag）"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 LSPOSED_TOKEN，跳过 LSPosed 同步（主仓已发布）"
            exit 0
          fi
          DIST=io.github.zeroedx.fuckprivacyguard
          REPO="Xposed-Modules-Repo/$DIST"
          if ! gh api "repos/$REPO" >/dev/null 2>&1; then
            echo "::warning::LSPosed 分发仓不存在或不可读，跳过同步"
            exit 0
          fi
          # ---- 授权判定（只读，不做写探针）----
          AUTH=""
          INSTALLS=$(gh api /user/installations --jq '.installations[].id' 2>/dev/null || true)
          if [ -n "$INSTALLS" ]; then
            # GitHub App 安装令牌：以安装覆盖的仓库列表为准
            for iid in $INSTALLS; do
              if gh api "/user/installations/$iid/repositories" --paginate \
                   --jq '.repositories[].full_name' 2>/dev/null | grep -qxF "$REPO"; then
                AUTH="installation $iid"
                break
              fi
            done
            if [ -z "$AUTH" ]; then
              echo "::warning::令牌为 GitHub App 安装令牌，但其安装范围不含 $REPO；跳过同步。请把该仓库加入 App 安装范围（或改用具备该仓 contents:write + releases:write 的令牌）。"
              exit 0
            fi
          else
            # 非安装令牌（细粒度 PAT）：此时 permissions.push 才可信
            PUSH=$(gh api "repos/$REPO" --jq '.permissions.push // false' 2>/dev/null || echo false)
            if [ "$PUSH" != "true" ]; then
              echo "::warning::令牌对 $REPO 无 push 权限，跳过同步"
              exit 0
            fi
            AUTH="pat permissions.push"
          fi
          echo "授权确认（$AUTH）"
          # ---- 复用主仓 Release 的原始 APK ----
          SRC="/tmp/main-verify/$RELEASE_ASSET"
          [ -f "$SRC" ] || { echo "::error::找不到主仓 Release 的 APK：$SRC" >&2; exit 1; }
          LOCAL_SHA=$(sha256sum "$SRC" | awk '{print $1}')
          if [ "$LOCAL_SHA" != "$APK_SHA256" ]; then
            echo "::error::待同步 APK 与构建件 SHA-256 不一致：$LOCAL_SHA != $APK_SHA256"
            exit 1
          fi
          CODE=$("$AAPT2" dump badging "$SRC" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          NAME=$("$AAPT2" dump badging "$SRC" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          TAG="$CODE-$NAME"
          NOTES="docs/RELEASE-$NAME.md"
          [ -f "$NOTES" ] || NOTES="docs/RELEASE.md"
          cp "$SRC" "/tmp/lsposed-$NAME.apk"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "分发仓已存在 Release $TAG，检查附件"
            if gh release view "$TAG" --repo "$REPO" --json assets \
                 --jq '.assets[].name' | grep -qxF "fuckPrivacyGuard-$NAME.apk"; then
              rm -rf /tmp/lsposed-existing && mkdir -p /tmp/lsposed-existing
              gh release download "$TAG" --repo "$REPO" \
                --pattern "fuckPrivacyGuard-$NAME.apk" --dir /tmp/lsposed-existing --clobber
              EXIST_SHA=$(sha256sum "/tmp/lsposed-existing/fuckPrivacyGuard-$NAME.apk" | awk '{print $1}')
              if [ "$EXIST_SHA" = "$LOCAL_SHA" ]; then
                echo "分发仓 APK SHA-256 相同，安全跳过上传"
              else
                echo "::error::分发仓 APK SHA-256 与主仓 Release 不同：$EXIST_SHA != $LOCAL_SHA；停止，不覆盖、不删除"
                exit 1
              fi
            else
              echo "Release $TAG 已存在但缺少附件；仅补传该附件（不删除其它资产）"
              gh release upload "$TAG" "/tmp/lsposed-$NAME.apk" --repo "$REPO"
            fi
          else
            gh release create "$TAG" "/tmp/lsposed-$NAME.apk" --repo "$REPO" \
              --title "$NAME" --notes-file "$NOTES"
          fi
          # 回读分发仓资产并比对，逐字节一致才算同步成功
          rm -rf /tmp/lsposed-verify && mkdir -p /tmp/lsposed-verify
          gh release download "$TAG" --repo "$REPO" \
            --pattern "fuckPrivacyGuard-$NAME.apk" --dir /tmp/lsposed-verify --clobber
          REMOTE_SHA=$(sha256sum "/tmp/lsposed-verify/fuckPrivacyGuard-$NAME.apk" | awk '{print $1}')
          if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
            echo "::error::分发仓 APK SHA-256 与主仓 Release 不一致：$REMOTE_SHA != $LOCAL_SHA"
            exit 1
          fi
          echo "LSPOSED_SYNCED=true" >> "$GITHUB_ENV"
          echo "LSPosed 同步校验通过：$TAG sha256=$LOCAL_SHA"

      # 发布结果汇总：区分「同步已禁用 / 同步成功 / 同步失败」三种情况
      - name: Summarize release result
        if: always() && startsWith(github.ref, 'refs/tags/')
        env:
          ENABLE_LSPOSED_SYNC: ${{ vars.ENABLE_LSPOSED_SYNC }}
        run: |
          set -e
          MAIN="${{ steps.main_release.outcome }}"
          VM="${{ steps.verify_main.outcome }}"
          LS="${{ steps.sync_lsposed.outcome }}"
          SYNCED="${LSPOSED_SYNCED:-false}"
          GATE="${ENABLE_LSPOSED_SYNC:-false}"
          echo "main_release=$MAIN verify_main=$VM sync_lsposed=$LS lsposed_synced=$SYNCED gate=$GATE"
          {
            echo "## 发布结果"
            echo ""
            echo "| 环节 | 结果 |"
            echo "|---|---|"
            echo "| 主仓 Release | ${MAIN:-skipped} |"
            echo "| 主仓 APK 校验 | ${VM:-skipped} |"
            echo "| LSPosed 分发仓同步 | ${LS:-skipped}（开关：$GATE，写入确认：$SYNCED） |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MAIN" = "success" ] && [ "$VM" = "success" ] && [ "$GATE" != "true" ]; then
            echo "主仓发布成功；LSPosed 同步已禁用（ENABLE_LSPOSED_SYNC 未设为 true）"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **主仓发布成功**：LSPosed 分发仓同步**已禁用**（未设置仓库变量 \`ENABLE_LSPOSED_SYNC=true\`），符合默认行为。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MAIN" = "success" ] && [ "$VM" = "success" ] && [ "$SYNCED" = "true" ]; then
            echo "双仓发布成功"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 双仓发布成功：主仓 Release 与 LSPosed 分发仓均已发布，且 SHA-256 一致。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MAIN" = "success" ] && [ "$VM" = "success" ] && [ "$GATE" = "true" ] && [ "$SYNCED" != "true" ]; then
            echo "::warning::部分发布成功：主仓 Release 已发布并通过校验，但 LSPosed 分发仓未同步（开关已开启）"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **部分发布成功**：主仓 Release 已发布，LSPosed 分发仓**未**同步（原因见上方日志）。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MAIN" = "success" ] && [ "$VM" != "success" ]; then
            echo "::error::主仓 Release 已发布，但附件 SHA-256 校验未通过，请人工核查"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> **异常**：主仓 Release 已发布，但附件校验失败，需人工核查；分发仓未同步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 发布未完成：主仓 Release 未成功发布。" >> "$GITHUB_STEP_SUMMARY"
          fi
